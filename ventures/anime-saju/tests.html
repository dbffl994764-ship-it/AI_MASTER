<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛도사 · 엔진 단위 확인</title><style>body{font-family:system-ui;max-width:760px;margin:32px auto;padding:0 18px;background:#171329;color:#f7f3ff}li{margin:10px 0;padding:10px;border-radius:8px;background:#2a2248}.pass{color:#7ee5e4}.fail{color:#ff9fca}code{color:#ffd6e8}</style></head>
<body><h1>사주 엔진 단위 확인</h1><p>브라우저에서 참조 엔진의 기본 계산·도시 보정·불확실성 표시를 확인합니다.</p><ol id="results"></ol><script type="module">
import { calculateSaju } from './js/saju/saju-core.js';
import { findBirthCity } from './js/saju/birth-cities.js';
const out=document.querySelector('#results'); const test=(name,ok,detail='')=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=`${ok?'PASS':'FAIL'} · ${name}${detail?` — ${detail}`:''}`;out.append(li);};
const city=findBirthCity('KR:Seoul'); const full=calculateSaju({date:'1995-05-20',time:'14:30',timeUnknown:false,timezone:city.zone,longitude:city.longitude});
test('서울 도시 데이터',!!city&&city.longitude===126.98,city?.zone); test('네 기둥 생성',!!full.yearPillar&&!!full.monthPillar&&!!full.dayPillar&&!!full.hourPillar,`${full.yearPillar?.label} · ${full.monthPillar?.label} · ${full.dayPillar?.label} · ${full.hourPillar?.label}`); test('오행 합계 8자',full.counts?.reduce((a,n)=>a+n,0)===8,full.counts?.join('·')); test('일간 노출',full.dayPillar?.stem==='신',full.dayPillar?.stem); test('진태양시 보정',full.calculation?.solarTimeCorrection?.longitude===126.98,full.calculation?.solarTimeCorrection?.localMeanTime); const unknown=calculateSaju({date:'1995-05-20',timeUnknown:true,timezone:'Asia/Seoul',longitude:126.98}); test('시간 미입력은 시주 생략',unknown.hourPillar===null,unknown.calculation?.uncertainty?.join(', '));
</script></body></html>
